<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>DinarSight – Iraqi Currency Recognition</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22c55e">

    <!-- SEO & Accessibility -->
    <meta name="description"
          content="DinarSight helps visually impaired users recognize Iraqi currency denominations using AI.">

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">

    <!-- Styles -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<main class="app-container" role="main">

    <!-- Camera Section -->
    <section class="camera-section" aria-label="Live currency scanner">

        <!-- Live Camera Preview -->
        <video id="video" autoplay playsinline></video>

        <!-- Hidden Canvas for Frame Capture -->
        <canvas id="canvas" hidden></canvas>

        <!-- Scan Overlay -->
        <div class="scan-overlay" aria-hidden="true">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
            <div class="scan-line"></div>
        </div>

    </section>

    <!-- Result Section -->
    <section class="result-section"
             aria-live="polite"
             aria-atomic="true">
        <p id="resultText">Opening camera...</p>
        <p id="confidenceText"></p>
    </section>

</main>

<!-- Scripts -->
<script src="/static/app.js"></script>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker
                .register("/static/service-worker.js")
                .then(() => console.log("Service Worker registered"))
                .catch(err => console.error("Service Worker failed", err));
        });
    }
</script>

</body>
</html>
